<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOU LMS Smart Hub - Lịch Phong Cách iOS & Ngân Hàng Câu Hỏi</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #007aff; --success: #34c759; --danger: #ff3b30; --warning: #ffcc00; --bg: #f2f2f7; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #1c1c1e; }
        .container { max-width: 1300px; margin: 0 auto; background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h1 { color: #000; margin-top: 0; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; font-size: 24px; }
        
        .main-nav { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #e5e5ea; padding-bottom: 10px; }
        .nav-tab { padding: 10px 20px; font-weight: 600; background: #e5e5ea; border: none; border-radius: 8px; cursor: pointer; color: #3a3a3c; }
        .nav-tab.active { background: var(--primary); color: white; }

        .section-view { display: none; }
        .section-view.active { display: block; }

        .semester-box { background: #f9f9fb; border: 1px solid #e5e5ea; border-radius: 12px; padding: 15px; margin-bottom: 20px; }
        .semester-title { font-size: 18px; font-weight: bold; color: var(--primary); margin-bottom: 12px; border-bottom: 1px dashed #d1d1d6; padding-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
        
        .subject-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
        .subject-card { background: white; border: 1px solid #d1d1d6; border-radius: 10px; padding: 15px; position: relative; box-shadow: 0 2px 6px rgba(0,0,0,0.04); }
        .subject-card h3 { margin: 0 0 8px 0; font-size: 16px; color: #000; cursor: pointer; }
        .subject-card h3:hover { color: var(--primary); text-decoration: underline; }
        .subject-card p { margin: 0 0 10px 0; font-size: 13px; color: #8e8e93; }
        
        .card-actions { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #eee; margin-top: 8px; padding-top: 8px; }
        .card-actions select { padding: 4px 8px; font-size: 12px; }

        .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; background: #f9f9fb; padding: 15px; border-radius: 10px; }
        select, button, input { padding: 8px 14px; border-radius: 8px; border: 1px solid #d1d1d6; font-weight: 600; cursor: pointer; }
        button { background: var(--primary); color: white; border: none; }
        button:hover { opacity: 0.9; }
        .btn-danger { background: var(--danger); }
        .btn-success { background: var(--success); }
        .btn-warning { background: var(--warning); color: #1c1c1e; }
        
        .tab-btn-filter { opacity: 0.5; border: 2px solid transparent; transition: all 0.2s; }
        .tab-btn-filter.active-tab { opacity: 1; border: 2px solid #000; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { border: 1px solid #e5e5ea; padding: 10px; text-align: left; }
        th { background: var(--primary); color: white; }
        tr:nth-child(even) { background: #fafafa; }
        .loading { text-align: center; padding: 30px; font-weight: bold; color: #8e8e93; }

        /* Giao diện Lịch chuẩn iOS */
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: #fff; padding: 10px 15px; border-radius: 12px; border: 1px solid #e5e5ea; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
        .calendar-weekday { text-align: center; font-weight: 600; padding: 8px; color: #8e8e93; font-size: 13px; text-transform: uppercase; }
        
        .calendar-cell { background: #fff; border: 1px solid #e5e5ea; min-height: 110px; border-radius: 10px; padding: 6px; display: flex; flex-direction: column; gap: 4px; position: relative; }
        .calendar-cell.empty { background: #f9f9fb; opacity: 0.4; }
        
        /* Vòng tròn đỏ cho ngày "Hôm nay" y hệt lịch iOS */
        .calendar-day-num { font-weight: 600; font-size: 14px; color: #1c1c1e; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
        .calendar-day-num.today { background: var(--danger); color: white; font-weight: bold; }

        /* Huy hiệu deadline phong cách iOS có chấm đỏ báo hiệu */
        .deadline-badge { 
            background: #fff2f2; 
            color: #d70015; 
            border: 1px solid #ff3b3033;
            font-size: 11px; 
            padding: 3px 6px; 
            border-radius: 6px; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            cursor: pointer; 
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .deadline-badge::before { content: '•'; color: var(--danger); font-size: 16px; font-weight: bold; }
        .deadline-badge:hover { 
            background: #ffe1e1; 
            white-space: normal; 
            overflow: visible; 
            z-index: 10; 
            box-shadow: 0 4px 12px rgba(255,59,48,0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            📚 HOU LMS Smart Hub (Lịch Chuẩn iOS)
            <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                <input type="file" id="json-file-input" style="display: none;" accept=".json" onchange="importJSON(event)">
                <button class="btn-warning" onclick="document.getElementById('json-file-input').click()">📥 Nhập JSON</button>
                <button class="btn-success" onclick="loadDirectory()" style="padding: 6px 10px; font-size: 12px;">🔄 Tải Lại</button>
                <span id="total-badge" style="font-size: 13px; background: #e5e5ea; color: #1c1c1e; padding: 4px 12px; border-radius: 20px;">Đang kết nối mây...</span>
            </div>
        </h1>

        <div class="main-nav">
            <button class="nav-tab active" onclick="switchMainTab('questions')">📖 Ngân Hàng Câu Hỏi</button>
            <button class="nav-tab" onclick="switchMainTab('deadlines')">📅 Lịch & Deadlines (Phong Cách iOS)</button>
        </div>

        <!-- TAB 1: NGÂN HÀNG CÂU HỎI -->
        <div id="view-questions" class="section-view active">
            <div style="margin-bottom: 15px; display: flex; gap: 10px; align-items: center;">
                <input type="text" id="new-semester-name" placeholder="Tên kỳ học mới (VD: Kỳ 2)...">
                <button class="btn-success" onclick="addNewSemester()">➕ Thêm Kỳ Học</button>
            </div>

            <div id="subject-directory">
                <div class="loading">Đang tải danh sách môn học siêu tốc...</div>
            </div>

            <div id="question-workspace" style="display: none; margin-top: 20px;">
                <button onclick="backToDirectory()" style="margin-bottom: 15px; background: #8e8e93;">⬅️ Quay lại danh sách môn</button>
                <div class="controls">
                    <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                        <h2 id="active-subject-title" style="margin: 0; color: var(--primary);">Môn học</h2>
                        <div style="display: flex; gap: 8px; margin-left: 15px;">
                            <button id="btn-tab-correct" class="btn-success tab-btn-filter active-tab" onclick="switchQuestionTab('correct')">✅ Kho Đúng</button>
                            <button id="btn-tab-wrong" class="btn-danger tab-btn-filter" onclick="switchQuestionTab('wrong')">❌ Kho Sai</button>
                        </div>
                    </div>
                    <div>
                        <button class="btn-success" onclick="exportWord()">📝 Xuất Word Ôn Tập</button>
                        <button class="btn-danger" onclick="deleteSubject()">🗑️ Xóa Môn Này</button>
                    </div>
                </div>

                <table>
                    <thead>
                        <tr>
                            <th style="width: 5%; text-align: center;">STT</th>
                            <th style="width: 45%;">Câu hỏi</th>
                            <th style="width: 35%;">Đáp án / Lựa chọn</th>
                            <th style="width: 15%; text-align: center;">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="question-list">
                        <tr><td colspan="4" class="loading">Đang tải câu hỏi của môn...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- TAB 2: LỊCH CHUẨN IOS -->
        <div id="view-deadlines" class="section-view">
            <div class="calendar-header">
                <button class="btn-success" onclick="changeMonth(-1)">◀ Tháng trước</button>
                <h2 id="calendar-month-title" style="margin: 0; color: var(--primary);">Tháng 10 2026</h2>
                <button class="btn-success" onclick="changeMonth(1)">Tháng sau ▶</button>
            </div>

            <div class="calendar-grid">
                <div class="calendar-weekday">T2</div>
                <div class="calendar-weekday">T3</div>
                <div class="calendar-weekday">T4</div>
                <div class="calendar-weekday">T5</div>
                <div class="calendar-weekday">T6</div>
                <div class="calendar-weekday">T7</div>
                <div class="calendar-weekday">CN</div>
            </div>
            <div id="calendar-days-container" class="calendar-grid" style="margin-top: 6px;">
                <!-- Render ô lịch ngày bằng JS -->
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://pbyrzmmetkvvqyodzkxo.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_hEzd_AChOmjjJ8fdPdFE9Q_msO0rQin';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        let subjectStats = {}; 
        let activeSubjectData = { correct: {}, wrong: {} }; 
        let activeSubject = '';
        let currentQuestionTab = 'correct';
        let semesters = JSON.parse(localStorage.getItem('hou_semesters') || '["Kỳ 1", "Kỳ 2", "Kỳ 3"]');
        let subjectSemesterMap = JSON.parse(localStorage.getItem('hou_subject_map') || '{}');
        
        let allDeadlines = [];
        let currentCalendarYear = new Date().getFullYear();
        let currentCalendarMonth = new Date().getMonth();

        async function loadDirectory() {
            document.getElementById('total-badge').innerText = 'Đang đồng bộ...';
            try {
                let allItems = [];
                let step = 1000, from = 0, fetchMore = true;

                while (fetchMore) {
                    let { data, error } = await supabaseClient.from('question_banks').select('subject, status').range(from, from + step - 1);
                    if (error) throw error;
                    if (data && data.length > 0) {
                        allItems = allItems.concat(data);
                        from += step;
                        if (data.length < step) fetchMore = false;
                    } else { fetchMore = false; }
                }

                subjectStats = {};
                allItems.forEach(item => {
                    let subName = (item.subject || "Chung").trim();
                    if (!subjectStats[subName]) subjectStats[subName] = { correct: 0, wrong: 0 };
                    let status = item.status && item.status.trim() !== '' ? item.status.trim() : 'correct';
                    if (status === 'wrong') subjectStats[subName].wrong++;
                    else subjectStats[subName].correct++;
                });

                renderDirectory();
                loadDeadlines();
                document.getElementById('total-badge').innerText = `Kết nối mây thành công! (${allItems.length} câu)`;
            } catch (err) {
                console.error("Lỗi load data:", err);
                document.getElementById('total-badge').innerText = 'Lỗi kết nối';
            }
        }

        function switchMainTab(tab) {
            document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.section-view').forEach(v => v.classList.remove('active'));
            
            if (tab === 'questions') {
                document.querySelector('.nav-tab:nth-child(1)').classList.add('active');
                document.getElementById('view-questions').classList.add('active');
            } else {
                document.querySelector('.nav-tab:nth-child(2)').classList.add('active');
                document.getElementById('view-deadlines').classList.add('active');
                renderCalendarGrid();
            }
        }

        function addNewSemester() {
            let name = document.getElementById('new-semester-name').value.trim();
            if (!name) return;
            if (!semesters.includes(name)) {
                semesters.push(name);
                localStorage.setItem('hou_semesters', JSON.stringify(semesters));
                document.getElementById('new-semester-name').value = '';
                renderDirectory();
            }
        }

        function changeSubjectSemester(subName, semName) {
            subjectSemesterMap[subName] = semName;
            localStorage.setItem('hou_subject_map', JSON.stringify(subjectSemesterMap));
            renderDirectory();
        }

        function renderDirectory() {
            const container = document.getElementById('subject-directory');
            container.innerHTML = '';
            let subjects = Object.keys(subjectStats);
            if (subjects.length === 0) {
                container.innerHTML = `<div class="loading">Chưa có dữ liệu câu hỏi nào trên mây!</div>`;
                return;
            }

            let grouped = {};
            semesters.forEach(sem => grouped[sem] = []);
            let unassigned = [];

            subjects.forEach(sub => {
                let stats = subjectStats[sub];
                let totalCount = stats.correct + stats.wrong;
                let sem = subjectSemesterMap[sub];
                if (sem && grouped[sem]) grouped[sem].push({ name: sub, count: totalCount });
                else unassigned.push({ name: sub, count: totalCount });
            });

            if (unassigned.length > 0) {
                grouped["Chưa phân kỳ"] = unassigned;
                if (!semesters.includes("Chưa phân kỳ")) semesters.push("Chưa phân kỳ");
            }

            for (let [sem, list] of Object.entries(grouped)) {
                if (list.length === 0 && sem !== "Kỳ 1") continue;
                let semBox = document.createElement('div');
                semBox.className = 'semester-box';
                semBox.innerHTML = `<div class="semester-title">📂 ${sem}</div>`;
                let grid = document.createElement('div');
                grid.className = 'subject-grid';

                list.forEach(item => {
                    let card = document.createElement('div');
                    card.className = 'subject-card';
                    let semOptions = semesters.map(s => `<option value="${s}" ${subjectSemesterMap[item.name] === s ? 'selected' : ''}>${s}</option>`).join('');
                    card.innerHTML = `
                        <h3 onclick="openSubject('${item.name.replace(/'/g, "\\'")}')">📖 ${item.name}</h3>
                        <p>📊 Tổng số: <b>${item.count}</b> câu hỏi</p>
                        <div class="card-actions">
                            <small>Đổi kỳ:</small>
                            <select onchange="changeSubjectSemester('${item.name.replace(/'/g, "\\'")}', this.value)">${semOptions}</select>
                        </div>
                    `;
                    grid.appendChild(card);
                });
                semBox.appendChild(grid);
                container.appendChild(semBox);
            }
        }

        async function openSubject(subName) {
            activeSubject = subName;
            currentQuestionTab = 'correct';
            document.getElementById('subject-directory').style.display = 'none';
            document.getElementById('question-workspace').style.display = 'block';
            document.getElementById('active-subject-title').innerText = `📖 Môn: ${subName}`;
            document.getElementById('question-list').innerHTML = `<tr><td colspan="4" class="loading">Đang tải chi tiết câu hỏi...</td></tr>`;
            updateTabButtonUI();

            try {
                let { data, error } = await supabaseClient.from('question_banks').select('*').eq('subject', subName);
                if (error) throw error;
                activeSubjectData = { correct: {}, wrong: {} };
                (data || []).forEach(item => {
                    let status = item.status && item.status.trim() !== '' ? item.status.trim() : 'correct';
                    let opts = item.options;
                    if (typeof opts === 'string') { try { opts = JSON.parse(opts); } catch(e) { opts = []; } }
                    activeSubjectData[status][item.question] = { correct: item.correct_answer, options: Array.isArray(opts) ? opts : [] };
                });
                renderQuestionsTable();
            } catch (err) {
                document.getElementById('question-list').innerHTML = `<tr><td colspan="4" class="loading" style="color:red;">Lỗi tải dữ liệu môn này!</td></tr>`;
            }
        }

        function backToDirectory() {
            document.getElementById('question-workspace').style.display = 'none';
            document.getElementById('subject-directory').style.display = 'block';
            loadDirectory();
        }

        function switchQuestionTab(tab) {
            currentQuestionTab = tab;
            updateTabButtonUI();
            renderQuestionsTable();
        }

        function updateTabButtonUI() {
            let btnCorrect = document.getElementById('btn-tab-correct');
            let btnWrong = document.getElementById('btn-tab-wrong');
            if (currentQuestionTab === 'correct') {
                btnCorrect.classList.add('active-tab');
                btnWrong.classList.remove('active-tab');
            } else {
                btnWrong.classList.add('active-tab');
                btnCorrect.classList.remove('active-tab');
            }
        }

        function renderQuestionsTable() {
            const tbody = document.getElementById('question-list');
            tbody.innerHTML = '';
            let targetList = activeSubjectData[currentQuestionTab] || {};
            let keys = Object.keys(targetList);

            if (keys.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="loading">Kho này hiện đang trống!</td></tr>`;
                return;
            }

            keys.forEach((q, index) => {
                let item = targetList[q];
                let tr = document.createElement('tr');
                let ansVal = typeof item === 'object' ? item.correct : item;
                let optVal = typeof item === 'object' && item.options ? item.options.join(' | ') : '';
                let actionHtml = `<button class="btn-danger" style="padding: 5px 8px; font-size: 12px;" onclick="deleteQuestion('${activeSubject}', '${q.replace(/'/g, "\\'")}')">Xóa</button>`;
                
                if (currentQuestionTab === 'wrong') {
                    actionHtml = `
                        <div style="display: flex; flex-direction: column; gap: 5px; align-items: center;">
                            <button class="btn-success" style="padding: 5px 8px; font-size: 11px;" onclick="fixAndMoveToCorrect('${activeSubject}', '${q.replace(/'/g, "\\'")}')">Sửa & Chuyển Đúng</button>
                            <button class="btn-danger" style="padding: 4px 6px; font-size: 11px;" onclick="deleteQuestion('${activeSubject}', '${q.replace(/'/g, "\\'")}')">Xóa</button>
                        </div>
                    `;
                }

                tr.innerHTML = `
                    <td style="text-align: center; font-weight: bold; color: #555;">${index + 1}</td>
                    <td>${q}</td>
                    <td><b>Đáp án:</b> <span style="color: var(--success);">${ansVal}</span><br><small style="color:#666;">Lựa chọn: ${optVal}</small></td>
                    <td style="text-align: center;">${actionHtml}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function fixAndMoveToCorrect(sub, q) {
            let newAns = prompt("Nhập đáp án đúng chuẩn xác sau khi tra cứu:", "");
            if (!newAns) return;
            let { error } = await supabaseClient.from('question_banks').update({ correct_answer: newAns, status: 'correct', updated_at: new Date().toISOString() }).eq('subject', sub).eq('question', q);
            if (!error) { alert('✨ Đã cập nhật đáp án và chuyển sang Kho Đúng!'); openSubject(sub); }
        }

        async function deleteQuestion(sub, q) {
            if (confirm('Xóa câu hỏi này khỏi mây chung?')) {
                await supabaseClient.from('question_banks').delete().eq('subject', sub).eq('question', q);
                openSubject(sub);
            }
        }

        async function deleteSubject() {
            if (!activeSubject) return;
            if (confirm(`Xóa toàn bộ dữ liệu môn [${activeSubject}] trên mây chung?`)) {
                await supabaseClient.from('question_banks').delete().eq('subject', activeSubject);
                backToDirectory();
            }
        }

        async function loadDeadlines() {
            let { data } = await supabaseClient.from('deadlines').select('*');
            allDeadlines = data || [];
            renderCalendarGrid();
        }

        async function deleteDeadline(id, title) {
            if (confirm(`Bạn muốn xóa sự kiện [${title}] này?`)) {
                let { error } = await supabaseClient.from('deadlines').delete().eq('id', id);
                if (!error) { alert('🗑️ Đã xóa sự kiện thành công!'); loadDeadlines(); }
                else { alert('Lỗi khi xóa sự kiện!'); }
            }
        }

        function changeMonth(direction) {
            currentCalendarMonth += direction;
            if (currentCalendarMonth > 11) { currentCalendarMonth = 0; currentCalendarYear++; }
            else if (currentCalendarMonth < 0) { currentCalendarMonth = 11; currentCalendarYear--; }
            renderCalendarGrid();
        }

        function renderCalendarGrid() {
            const monthNames = ["Tháng 1", "Tháng 2", "Tháng 3", "Tháng 4", "Tháng 5", "Tháng 6", "Tháng 7", "Tháng 8", "Tháng 9", "Tháng 10", "Tháng 11", "Tháng 12"];
            document.getElementById('calendar-month-title').innerText = `${monthNames[currentCalendarMonth]} ${currentCalendarYear}`;

            const container = document.getElementById('calendar-days-container');
            container.innerHTML = '';

            let firstDayIndex = new Date(currentCalendarYear, currentCalendarMonth, 1).getDay();
            let totalDays = new Date(currentCalendarYear, currentCalendarMonth + 1, 0).getDate();
            let startDay = firstDayIndex === 0 ? 6 : firstDayIndex - 1;

            let now = new Date();
            let todayStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

            let prevDays = new Date(currentCalendarYear, currentCalendarMonth, 0).getDate();
            for (let i = startDay - 1; i >= 0; i--) {
                let cell = document.createElement('div');
                cell.className = 'calendar-cell empty';
                cell.innerHTML = `<div class="calendar-day-num" style="color:#c7c7cc;">${prevDays - i}</div>`;
                container.appendChild(cell);
            }

            for (let day = 1; day <= totalDays; day++) {
                let cell = document.createElement('div');
                cell.className = 'calendar-cell';
                
                let dayStr = String(day).padStart(2, '0');
                let monthStr = String(currentCalendarMonth + 1).padStart(2, '0');
                let dateKey = `${currentCalendarYear}-${monthStr}-${dayStr}`;

                // Kiểm tra có phải ngày "Hôm nay" không để bôi tròn đỏ chuẩn iOS
                let isToday = (dateKey === todayStr);
                let dayNumClass = isToday ? "calendar-day-num today" : "calendar-day-num";

                // Lọc sự kiện theo đúng chuẩn khóa YYYY-MM-DD
                let matchedDeadlines = allDeadlines.filter(d => (d.deadline_time || '').startsWith(dateKey));

                let deadlinesHtml = matchedDeadlines.map(d => `
                    <div class="deadline-badge" title="${d.title} (Click để xóa)" onclick="deleteDeadline('${d.id}', '${d.title.replace(/'/g, "\\'")}')">
                        ${d.title}
                    </div>
                `).join('');

                cell.innerHTML = `
                    <div class="${dayNumClass}">${day}</div>
                    <div style="display:flex; flex-direction:column; gap:3px; overflow-y:auto; max-height:80px;">${deadlinesHtml}</div>
                `;
                container.appendChild(cell);
            }
        }

        async function importJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const jsonData = JSON.parse(e.target.result);
                    alert('Đang nhập dữ liệu lên mây...');
                    let records = [];
                    for (let [sub, content] of Object.entries(jsonData)) {
                        let correctDict = content.correct || content;
                        for (let [q, info] of Object.entries(correctDict)) {
                            let ans = info.correct || info;
                            let opts = info.options || [];
                            if (q && ans) records.push({ subject: sub, question: q, correct_answer: ans, options: opts, status: 'correct', updated_at: new Date().toISOString() });
                        }
                    }
                    for (let i = 0; i < records.length; i += 50) {
                        await supabaseClient.from('question_banks').upsert(records.slice(i, i + 50), { onConflict: 'subject,question' });
                    }
                    alert('✨ Nhập dữ liệu thành công!');
                    loadDirectory();
                } catch (err) { alert('Lỗi: ' + err.message); }
            };
            reader.readAsText(file);
        }

        function exportWord() {
            let correctList = Object.assign({}, activeSubjectData.correct || {}, activeSubjectData.wrong || {});
            let keys = Object.keys(correctList);
            if (keys.length === 0) { alert('Kho trống!'); return; }

            let html = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
            <head><meta charset='utf-8'><title>${activeSubject}</title></head>
            <body style="font-family:'Times New Roman'; font-size:13pt; line-height: 1.4;">
            <h1 style="text-align:center; color:#0056b3;">ĐÁP ÁN ÔN TẬP: ${activeSubject.toUpperCase()}</h1><hr>`;

            keys.forEach((q, idx) => {
                let item = correctList[q];
                html += `<div style="margin-bottom:15px;"><b>Câu ${idx+1}:</b> ${q}<br>`;
                if (item.options && item.options.length > 0) {
                    item.options.forEach((opt, oIdx) => {
                        let optLetter = String.fromCharCode(65 + oIdx);
                        if (opt.trim().toLowerCase() === item.correct.trim().toLowerCase()) {
                            html += `<span style="color: #008000; font-weight: bold;">&nbsp;&nbsp;&nbsp;&nbsp;${optLetter}. ${opt} (Đúng)</span><br>`;
                        } else {
                            html += `&nbsp;&nbsp;&nbsp;&nbsp;${optLetter}. ${opt}<br>`;
                        }
                    });
                } else {
                    html += `<span style="color: #008000; font-weight: bold;">👉 Đáp án: ${item.correct}</span><br>`;
                }
                html += `</div>`;
            });
            html += `</body></html>`;

            let blob = new Blob(['\ufeff' + html], { type: 'application/msword' });
            let url = URL.createObjectURL(blob);
            let a = document.createElement('a');
            a.href = url;
            a.download = `On_Tap_${activeSubject.replace(/\s+/g, '_')}.doc`;
            a.click();
        }

        loadDirectory();
    </script>
</body>
</html>
