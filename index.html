<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOU LMS Cloud Study Hub - Dùng Chung</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #0056b3; margin-top: 0; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; background: #f8f9fa; padding: 15px; border-radius: 8px; }
        select, button { padding: 8px 12px; border-radius: 6px; border: 1px solid #ccc; font-weight: bold; cursor: pointer; }
        button { background: #0056b3; color: white; border: none; }
        button:hover { background: #004085; }
        .btn-danger { background: #dc3545; }
        .btn-danger:hover { background: #bd2130; }
        .btn-success { background: #28a745; }
        .btn-success:hover { background: #218838; }
        .btn-warning { background: #ffc107; color: #333; }
        .btn-warning:hover { background: #e0a800; }
        .btn-info { background: #17a2b8; color: white; }
        .btn-info:hover { background: #138496; }
        .tab-container { display: flex; gap: 5px; }
        .tab-btn { background: #e9ecef; color: #495057; border: none; }
        .tab-btn.active-correct { background: #0056b3; color: white; }
        .tab-btn.active-wrong { background: #dc3545; color: white; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { border: 1px solid #dee2e6; padding: 10px; text-align: left; }
        th { background: #0056b3; color: white; }
        tr:nth-child(even) { background: #f9f9f9; }
        .loading { text-align: center; padding: 30px; font-weight: bold; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            📚 HOU LMS Cloud Study Hub (Dùng Chung)
            <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                <input type="file" id="json-file-input" style="display: none;" accept=".json" onchange="importJSON(event)">
                <button class="btn-warning" onclick="document.getElementById('json-file-input').click()">📥 Nhập File JSON</button>
                <button class="btn-info" onclick="exportAllJSON()">📤 Xuất All JSON</button>
                <button class="btn-success" onclick="loadData()" style="padding: 6px 10px; font-size: 12px;">🔄 Tải Lại</button>
                <span id="total-badge" style="font-size: 14px; background: #e2e8f0; color: #2d3748; padding: 4px 10px; border-radius: 20px;">Đang kết nối mây...</span>
            </div>
        </h1>

        <div class="controls">
            <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                <label><b>Chọn môn:</b></label>
                <select id="subject-select" style="min-width: 200px;"></select>
                <div class="tab-container">
                    <button id="btn-tab-correct" class="tab-btn active-correct" onclick="switchTab('correct')">✅ Kho Đúng</button>
                    <button id="btn-tab-wrong" class="tab-btn" onclick="switchTab('wrong')">❌ Kho Sai</button>
                </div>
            </div>
            <div>
                <button class="btn-success" onclick="exportWord()">📝 Xuất Word Ôn Tập</button>
                <button class="btn-danger" onclick="deleteSubject()">🗑️ Xóa Môn Này</button>
            </div>
        </div>

        <div id="content-area">
            <table>
                <thead>
                    <tr>
                        <th style="width: 50%;">Câu hỏi</th>
                        <th style="width: 40%;">Đáp án / Lựa chọn</th>
                        <th style="width: 10%; text-align: center;">Thao tác</th>
                    </tr>
                </thead>
                <tbody id="question-list">
                    <tr><td colspan="3" class="loading">Đang tải dữ liệu từ Supabase...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://pbyrzmmetkvvqyodzkxo.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBieXJ6bW1ldGt2dnF5b2R6a3hvIicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyNzk1NzMsImV4cCI6MjEwNjg1NTU3M30.DGqyr-ESNBo1tYK5hCyG-nP2Tbq_ehAQKcyEgvEAlXM';
        
        let currentTab = 'correct';
        let globalData = {};

        async function loadData() {
            document.getElementById('total-badge').innerText = 'Đang đồng bộ...';
            try {
                let response = await fetch(`${SUPABASE_URL}/rest/v1/question_banks?select=*`, {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });
                if (!response.ok) throw new Error('Không thể kết nối đến Supabase');
                
                let data = await response.json();

                globalData = {};
                (data || []).forEach(item => {
                    if (!globalData[item.subject]) {
                        globalData[item.subject] = { correct: {}, wrong: {} };
                    }
                    let status = item.status || 'correct';
                    let opts = item.options;
                    if (typeof opts === 'string') {
                        try { opts = JSON.parse(opts); } catch(e) { opts = []; }
                    }
                    globalData[item.subject][status][item.question] = {
                        correct: item.correct_answer,
                        options: Array.isArray(opts) ? opts : []
                    };
                });

                updateSubjectDropdown();
                document.getElementById('total-badge').innerText = 'Kết nối mây thành công!';
            } catch (err) {
                console.error("Lỗi load data:", err);
                document.getElementById('question-list').innerHTML = `<tr><td colspan="3" class="loading" style="color:red;">Lỗi kết nối Supabase: ${err.message}. Hãy bấm nút "Tải Lại"!</td></tr>`;
                document.getElementById('total-badge').innerText = 'Lỗi kết nối';
            }
        }

        async function importJSON(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const jsonData = JSON.parse(e.target.result);
                    alert('Đang xử lý và đẩy dữ liệu lên mây chung, vui lòng chờ...');
                    
                    let records = [];
                    for (let [sub, content] of Object.entries(jsonData)) {
                        let correctDict = content.correct || content;
                        for (let [q, info] of Object.entries(correctDict)) {
                            let ans = info.correct || info;
                            let opts = info.options || [];
                            if (q && ans) {
                                records.push({
                                    subject: sub,
                                    question: q,
                                    correct_answer: ans,
                                    options: opts,
                                    status: 'correct',
                                    updated_at: new Date().toISOString()
                                });
                            }
                        }
                    }

                    for (let i = 0; i < records.length; i += 50) {
                        let batch = records.slice(i, i + 50);
                        await fetch(`${SUPABASE_URL}/rest/v1/question_banks`, {
                            method: 'POST',
                            headers: {
                                'apikey': SUPABASE_KEY,
                                'Authorization': `Bearer ${SUPABASE_KEY}`,
                                'Content-Type': 'application/json',
                                'Prefer': 'resolution=merge-duplicates'
                            },
                            body: JSON.stringify(batch)
                        });
                    }

                    alert(`✨ Đã nhập thành công ${records.length} câu hỏi lên mây chung!`);
                    loadData();
                } catch (err) {
                    alert('Lỗi nhập file JSON: ' + err.message);
                }
            };
            reader.readAsText(file);
        }

        function updateSubjectDropdown() {
            const select = document.getElementById('subject-select');
            let currentVal = select.value;
            select.innerHTML = '';

            let subjects = Object.keys(globalData);
            if (subjects.length === 0) {
                select.innerHTML = '<option value="">Chưa có dữ liệu</option>';
                document.getElementById('question-list').innerHTML = `<tr><td colspan="3" class="loading">Chưa có câu hỏi nào trên mây!</td></tr>`;
                return;
            }

            subjects.forEach(sub => {
                let count = Object.keys(globalData[sub].correct || {}).length + Object.keys(globalData[sub].wrong || {}).length;
                let opt = document.createElement('option');
                opt.value = sub;
                opt.innerText = `${sub} (${count} câu)`;
                select.appendChild(opt);
            });

            if (currentVal && subjects.includes(currentVal)) {
                select.value = currentVal;
            }
            renderTable();
        }

        function switchTab(tab) {
            currentTab = tab;
            if (tab === 'correct') {
                document.getElementById('btn-tab-correct').className = 'tab-btn active-correct';
                document.getElementById('btn-tab-wrong').className = 'tab-btn';
            } else {
                document.getElementById('btn-tab-correct').className = 'tab-btn';
                document.getElementById('btn-tab-wrong').className = 'tab-btn active-wrong';
            }
            renderTable();
        }

        function renderTable() {
            const select = document.getElementById('subject-select');
            const sub = select.value;
            const tbody = document.getElementById('question-list');
            tbody.innerHTML = '';

            if (!sub || !globalData[sub]) {
                tbody.innerHTML = `<tr><td colspan="3" class="loading">Không có dữ liệu cho môn này!</td></tr>`;
                return;
            }

            let targetList = globalData[sub][currentTab] || {};
            let keys = Object.keys(targetList);

            if (keys.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="loading">${currentTab === 'correct' ? 'Kho Đúng' : 'Kho Sai'} trống!</td></tr>`;
                return;
            }

            keys.forEach(q => {
                let item = targetList[q];
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${q}</td>
                    <td><b>Đáp án:</b> <span style="color: ${currentTab === 'correct' ? '#28a745' : '#dc3545'};">${item.correct}</span><br><small style="color:#666;">Lựa chọn: ${item.options ? item.options.join(' | ') : ''}</small></td>
                    <td style="text-align: center;">
                        <button class="btn-danger" style="padding: 5px 8px; font-size: 12px;" onclick="deleteQuestion('${sub}', '${q.replace(/'/g, "\\'")}')">Xóa</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        document.getElementById('subject-select').onchange = renderTable;

        async function deleteQuestion(sub, q) {
            if (confirm('Bạn có chắc muốn xóa câu hỏi này khỏi mây chung?')) {
                await fetch(`${SUPABASE_URL}/rest/v1/question_banks?subject=eq.${encodeURIComponent(sub)}&question=eq.${encodeURIComponent(q)}`, {
                    method: 'DELETE',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });
                loadData();
            }
        }

        async function deleteSubject() {
            const sub = document.getElementById('subject-select').value;
            if (!sub) return;
            if (confirm(`Xóa toàn bộ dữ liệu môn [${sub}] trên mây chung?`)) {
                await fetch(`${SUPABASE_URL}/rest/v1/question_banks?subject=eq.${encodeURIComponent(sub)}`, {
                    method: 'DELETE',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });
                loadData();
            }
        }

        function exportWord() {
            const sub = document.getElementById('subject-select').value;
            if (!sub || !globalData[sub]) return;
            let correctList = globalData[sub].correct || {};
            let keys = Object.keys(correctList);
            if (keys.length === 0) {
                alert('Kho Đúng của môn này đang trống để xuất Word!');
                return;
            }

            let html = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
            <head><meta charset='utf-8'><title>${sub}</title></head>
            <body style="font-family:'Times New Roman'; font-size:13pt; line-height: 1.4;">
            <h1 style="text-align:center; color:#0056b3;">ĐÁP ÁN ÔN TẬP: ${sub.toUpperCase()}</h1><hr>`;

            keys.forEach((q, idx) => {
                let item = correctList[q];
                html += `<div style="margin-bottom:15px;">
                    <b>Câu ${idx+1}:</b> ${q}<br>`;
                
                if (item.options && item.options.length > 0) {
                    item.options.forEach((opt, oIdx) => {
                        let optLetter = String.fromCharCode(65 + oIdx);
                        let isCorrect = opt.trim().toLowerCase() === item.correct.trim().toLowerCase();
                        if (isCorrect) {
                            html += `<span style="color: #008000; font-weight: bold;">&nbsp;&nbsp;&nbsp;&nbsp;${optLetter}. ${opt} (Đúng)</span><br>`;
                        } else {
                            html += `&nbsp;&nbsp;&nbsp;&nbsp;${optLetter}. ${opt}<br>`;
                        }
                    });
                } else {
                    html += `<span style="color: #008000; font-weight: bold;">👉 Đáp án: ${item.correct}</span><br>`;
                }
                html += `</div>`;
            });
            html += `</body></html>`;

            let blob = new Blob(['\ufeff' + html], { type: 'application/msword' });
            let url = URL.createObjectURL(blob);
            let a = document.createElement('a');
            a.href = url;
            a.download = `On_Tap_${sub.replace(/\s+/g, '_')}.doc`;
            a.click();
        }

        function exportAllJSON() {
            let exportObj = {};
            for (let sub of Object.keys(globalData)) {
                exportObj[sub] = { correct: {}, wrong: {} };
                for (let q of Object.keys(globalData[sub].correct || {})) {
                    exportObj[sub].correct[q] = globalData[sub].correct[q];
                }
                for (let q of Object.keys(globalData[sub].wrong || {})) {
                    exportObj[sub].wrong[q] = globalData[sub].wrong[q];
                }
            }

            let dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportObj, null, 2));
            let a = document.createElement('a');
            a.href = dataStr;
            a.download = "Kho_Dap_An_Backup_Full.json";
            a.click();
        }

        loadData();
    </script>
</body>
</html>
